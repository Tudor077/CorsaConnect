name: Android APK

# Builds the CorsaConnect phone app and attaches the APK to the run, and to a
# pre-release with a direct .apk link you can tap on the phone - no Android
# Studio needed.

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write        # needed to attach the APK to a release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete 'tools' package, which
          # sdkmanager no longer serves. AGP fetches what it needs itself.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name it after the version and run
        working-directory: android
        run: |
          ver=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' app/build.gradle)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/CorsaConnect-${ver}-build${GITHUB_RUN_NUMBER}.apk"
          ls -lh out

      - name: Upload the APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: CorsaConnect-apk
          path: android/out/*.apk
          if-no-files-found: error

      # An Actions artifact is a login-gated zip, which is painful to install
      # from a phone. A release asset is a direct .apk link you can tap.
      - name: Publish it as a pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: CorsaConnect APK build ${{ github.run_number }}
          prerelease: true
          files: android/out/*.apk
          body: |
            Debug-signed APK of the CorsaConnect phone app, built from
            `${{ github.sha }}` (branch `${{ github.ref_name }}`).

            Tap the `.apk` below on your phone to install. Android will ask you
            to allow installs from your browser the first time. If an older
            CorsaConnect built in Android Studio is installed, uninstall it
            first: the signing key differs.
